<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Case Opening</title>
<style>
:root{--bg:#0b0f14;--card:#121821;--accent:#3b82f6}
body{margin:0;background:var(--bg);color:#e5e7eb;font-family:Arial;text-align:center}
button{padding:10px 16px;border-radius:10px;border:none;background:#2563eb;color:white;cursor:pointer}
button:disabled{opacity:0.5;cursor:not-allowed}

.stage{margin:30px auto;width:700px;background:#020617;border-radius:16px;padding:20px}
.roller-wrap{position:relative;overflow:hidden}
.marker{position:absolute;left:50%;top:0;bottom:0;width:3px;background:red}
.roller{display:flex}

.slot{width:140px;height:140px;margin:5px;background:#111;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.slot img{width:100px}

.inventory{margin-top:20px}
.item{display:inline-block;background:#111;margin:5px;padding:5px;border-radius:8px;width:100px}
</style>
</head>
<body>

<h1>CS2 Case Opening</h1>
<button id="openBtn" onclick="openCase()">Åbn Case</button>

<div class="stage">
  <div class="roller-wrap">
    <div class="marker"></div>
    <div id="roller" class="roller"></div>
  </div>
</div>

<h2>Inventory</h2>
<div id="inv" class="inventory"></div>

<script>
let rolling=false;
let inventory=[];

const skins=[
{name:'Trash',img:'https://picsum.photos/seed/1/100',price:1},
{name:'AK',img:'https://picsum.photos/seed/2/100',price:10},
{name:'M4',img:'https://picsum.photos/seed/3/100',price:25},
{name:'AWP',img:'https://picsum.photos/seed/4/100',price:100},
{name:'Knife',img:'https://picsum.photos/seed/5/100',price:500}
];

function openCase(){
  if(rolling) return; // prevent spam
  rolling=true;
  openBtn.disabled=true;

  const roller=document.getElementById('roller');
  roller.innerHTML='';

  // build long strip
  for(let i=0;i<120;i++){
    let s=skins[Math.floor(Math.random()*skins.length)];
    let div=document.createElement('div');
    div.className='slot';
    div.innerHTML=`<img src='${s.img}'><div>${s.name}</div>`;
    roller.appendChild(div);
  }

  let pos=0;
  let speed=40;

  let int=setInterval(()=>{
    pos-=speed;
    roller.style.transform=`translateX(${pos}px)`;
    speed*=0.97;

    if(speed<0.5){
      clearInterval(int);

      // give item AFTER animation
      let win=skins[Math.floor(Math.random()*skins.length)];
      inventory.push(win);
      renderInventory();

      rolling=false;
      openBtn.disabled=false;
    }

  },30);
}

function renderInventory(){
  inv.innerHTML='';
  inventory.forEach((s,i)=>{
    let div=document.createElement('div');
    div.className='item';
    div.innerHTML=`<img src='${s.img}' width='80'><br>${s.name}<br>$${s.price}<br>
    <button onclick='sell(${i})'>Sælg</button>`;
    inv.appendChild(div);
  });
}

function sell(i){
  inventory.splice(i,1);
  renderInventory();
}
</script>

</body>
</html>
