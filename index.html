<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DRIVEFORGE | 3D Car Customizer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background: #08090d;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        #canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        .logo {
            position: fixed;
            top: 25px;
            left: 30px;
            z-index: 10;
        }

        .logo h1 {
            font-size: 24px;
            letter-spacing: 4px;
        }

        .logo span {
            color: #00d9ff;
        }

        .logo p {
            margin-top: 5px;
            color: #8c919c;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .stats {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 10;
            text-align: right;
        }

        .stats p {
            color: #9096a3;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .stats b {
            color: #00d9ff;
        }

        .panel {
            position: fixed;
            left: 25px;
            bottom: 25px;
            width: 330px;
            max-height: 75vh;
            overflow-y: auto;
            z-index: 10;
            background: rgba(15, 17, 23, 0.88);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 18px;
        }

        .panel::-webkit-scrollbar {
            width: 5px;
        }

        .panel::-webkit-scrollbar-thumb {
            background: #00d9ff;
            border-radius: 10px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section h2 {
            font-size: 11px;
            letter-spacing: 2px;
            color: #818897;
            margin-bottom: 10px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            border: 1px solid rgba(255,255,255,0.1);
            background: #1a1d26;
            color: white;
            padding: 10px 12px;
            border-radius: 9px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        button:hover {
            border-color: #00d9ff;
            transform: translateY(-2px);
        }

        button.active {
            background: #00d9ff;
            color: #00151a;
            border-color: #00d9ff;
        }

        .color {
            width: 42px;
            height: 42px;
            padding: 0;
            border-radius: 50%;
        }

        .red { background: #e02020; }
        .blue { background: #0066ff; }
        .green { background: #00c76f; }
        .white { background: #eeeeee; }
        .black { background: #111111; }
        .yellow { background: #ffbd00; }

        .bottom {
            position: fixed;
            bottom: 25px;
            right: 30px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .main-button {
            background: #00d9ff;
            color: #001419;
            border: none;
            padding: 13px 18px;
        }

        .main-button:hover {
            background: white;
        }

        .hint {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            z-index: 5;
            color: #747b89;
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
        }

        @media (max-width: 700px) {
            .panel {
                left: 10px;
                bottom: 10px;
                width: calc(100% - 20px);
                max-height: 42vh;
            }

            .logo {
                top: 15px;
                left: 15px;
            }

            .stats {
                display: none;
            }

            .bottom {
                top: 15px;
                bottom: auto;
                right: 15px;
            }

            .hint {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="logo">
    <h1>DRIVE<span>FORGE</span></h1>
    <p>BUILD YOUR PERFECT CAR</p>
</div>

<div class="stats">
    <p>MODEL: <b>SPORT GT</b></p>
    <p>GARAGE: <b>01</b></p>
</div>

<div id="canvas"></div>

<div class="panel">

    <div class="section">
        <h2>CAR COLOR</h2>
        <div class="buttons">
            <button class="color red" onclick="setCarColor('#e02020')"></button>
            <button class="color blue" onclick="setCarColor('#0066ff')"></button>
            <button class="color green" onclick="setCarColor('#00c76f')"></button>
            <button class="color white" onclick="setCarColor('#eeeeee')"></button>
            <button class="color black" onclick="setCarColor('#111111')"></button>
            <button class="color yellow" onclick="setCarColor('#ffbd00')"></button>
        </div>
    </div>

    <div class="section">
        <h2>BODY KIT</h2>
        <div class="buttons">
            <button class="active" id="stockBtn" onclick="setBodykit('stock')">STOCK</button>
            <button id="streetBtn" onclick="setBodykit('street')">STREET</button>
            <button id="raceBtn" onclick="setBodykit('race')">RACE</button>
        </div>
    </div>

    <div class="section">
        <h2>REAR WING</h2>
        <div class="buttons">
            <button class="active" id="wingOff" onclick="setWing(false)">NONE</button>
            <button id="wingOn" onclick="setWing(true)">SPOILER</button>
        </div>
    </div>

    <div class="section">
        <h2>WHEELS</h2>
        <div class="buttons">
            <button class="active" onclick="setWheels('normal')">CLASSIC</button>
            <button onclick="setWheels('sport')">SPORT</button>
            <button onclick="setWheels('race')">RACING</button>
        </div>
    </div>

    <div class="section">
        <h2>SUSPENSION</h2>
        <div class="buttons">
            <button onclick="setHeight(0.25)">HIGH</button>
            <button class="active" onclick="setHeight(0)">NORMAL</button>
            <button onclick="setHeight(-0.22)">LOW</button>
        </div>
    </div>

    <div class="section">
        <h2>UNDERGLOW</h2>
        <div class="buttons">
            <button class="active" onclick="setNeon('off')">OFF</button>
            <button onclick="setNeon('cyan')">CYAN</button>
            <button onclick="setNeon('red')">RED</button>
            <button onclick="setNeon('purple')">PURPLE</button>
        </div>
    </div>

</div>

<div class="bottom">
    <button onclick="resetCar()">RESET</button>
    <button class="main-button" onclick="saveCar()">SAVE BUILD</button>
</div>

<div class="hint">DRAG TO ROTATE • SCROLL TO ZOOM</div>


<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08090d);
scene.fog = new THREE.Fog(0x08090d, 10, 45);

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(7, 4.5, 8);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

document.getElementById("canvas").appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 1, 0);
controls.minDistance = 5;
controls.maxDistance = 18;


/* LIGHTS */

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x111122,
    2
);

scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffffff, 4);
keyLight.position.set(5, 8, 5);
keyLight.castShadow = true;
scene.add(keyLight);

const blueLight = new THREE.PointLight(0x00d9ff, 20, 20);
blueLight.position.set(-5, 3, 3);
scene.add(blueLight);

const redLight = new THREE.PointLight(0xff004c, 15, 15);
redLight.position.set(5, 2, -5);
scene.add(redLight);


/* FLOOR */

const floorGeometry = new THREE.PlaneGeometry(100, 100);

const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x101218,
    metalness: 0.8,
    roughness: 0.25
});

const floor = new THREE.Mesh(floorGeometry, floorMaterial);

floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;

scene.add(floor);


/* CAR */

const car = new THREE.Group();
scene.add(car);

const carMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x0066ff,
    metalness: 0.7,
    roughness: 0.22,
    clearcoat: 1,
    clearcoatRoughness: 0.1
});

const darkMaterial = new THREE.MeshStandardMaterial({
    color: 0x090909,
    metalness: 0.7,
    roughness: 0.25
});

const glassMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x101820,
    metalness: 0.3,
    roughness: 0.05,
    transparent: true,
    opacity: 0.7
});


/* MAIN BODY */

const body = new THREE.Mesh(
    new THREE.BoxGeometry(4.8, 0.85, 2),
    carMaterial
);

body.position.y = 1.05;
body.castShadow = true;
car.add(body);


/* HOOD SHAPE */

const hood = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.35, 1.85),
    carMaterial
);

hood.position.set(1.25, 1.55, 0);
hood.rotation.z = -0.05;
car.add(hood);


/* CABIN */

const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(2.25, 0.9, 1.7),
    glassMaterial
);

cabin.position.set(-0.45, 1.85, 0);
cabin.rotation.z = -0.05;
car.add(cabin);


/* FRONT BUMPER */

const frontBumper = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.5, 2.05),
    carMaterial
);

frontBumper.position.set(2.55, 0.85, 0);
car.add(frontBumper);


/* REAR BUMPER */

const rearBumper = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.5, 2.05),
    carMaterial
);

rearBumper.position.set(-2.55, 0.85, 0);
car.add(rearBumper);


/* WHEELS */

const wheels = [];

function createWheel(x, z) {

    const wheelGroup = new THREE.Group();

    const tire = new THREE.Mesh(
        new THREE.CylinderGeometry(0.52, 0.52, 0.32, 32),
        darkMaterial
    );

    tire.rotation.x = Math.PI / 2;
    tire.castShadow = true;

    wheelGroup.add(tire);

    const rimMaterial = new THREE.MeshStandardMaterial({
        color: 0xaaaaaa,
        metalness: 1,
        roughness: 0.2
    });

    const rim = new THREE.Mesh(
        new THREE.CylinderGeometry(0.32, 0.32, 0.34, 16),
        rimMaterial
    );

    rim.rotation.x = Math.PI / 2;
    wheelGroup.add(rim);

    wheelGroup.position.set(x, 0.55, z);

    car.add(wheelGroup);
    wheels.push({ group: wheelGroup, rim });

}

createWheel(1.55, 1.05);
createWheel(1.55, -1.05);
createWheel(-1.55, 1.05);
createWheel(-1.55, -1.05);


/* SPOILER */

const spoiler = new THREE.Group();

const spoilerMaterial = new THREE.MeshStandardMaterial({
    color: 0x111111,
    metalness: 0.8,
    roughness: 0.2
});

const wing = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.18, 0.4),
    spoilerMaterial
);

wing.position.y = 0.75;

const stand1 = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.7, 0.12),
    spoilerMaterial
);

stand1.position.set(-0.55, 0.35, 0);

const stand2 = stand1.clone();
stand2.position.x = 0.55;

spoiler.add(wing, stand1, stand2);

spoiler.position.set(-2.1, 1.35, 0);
spoiler.visible = false;

car.add(spoiler);


/* BODYKIT */

const streetKit = new THREE.Group();

const side1 = new THREE.Mesh(
    new THREE.BoxGeometry(3.8, 0.18, 0.2),
    spoilerMaterial
);

side1.position.set(0, 0.55, 1.08);

const side2 = side1.clone();
side2.position.z = -1.08;

streetKit.add(side1, side2);
streetKit.visible = false;

car.add(streetKit);


const raceKit = new THREE.Group();

const splitter = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 0.1, 2.4),
    spoilerMaterial
);

splitter.position.set(2.75, 0.52, 0);

const diffuser = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 0.12, 2.3),
    spoilerMaterial
);

diffuser.position.set(-2.75, 0.55, 0);

raceKit.add(splitter, diffuser);
raceKit.visible = false;

car.add(raceKit);


/* NEON */

const neon = new THREE.PointLight(0x00d9ff, 0, 7);

neon.position.set(0, 0.25, 0);
car.add(neon);


/* FUNCTIONS */

window.setCarColor = function(color) {
    carMaterial.color.set(color);
};

window.setWing = function(show) {
    spoiler.visible = show;

    document.getElementById("wingOff").classList.toggle("active", !show);
    document.getElementById("wingOn").classList.toggle("active", show);
};

window.setBodykit = function(type) {

    streetKit.visible = false;
    raceKit.visible = false;

    document.getElementById("stockBtn").classList.remove("active");
    document.getElementById("streetBtn").classList.remove("active");
    document.getElementById("raceBtn").classList.remove("active");

    if (type === "street") {
        streetKit.visible = true;
        document.getElementById("streetBtn").classList.add("active");
    }
    else if (type === "race") {
        raceKit.visible = true;
        document.getElementById("raceBtn").classList.add("active");
    }
    else {
        document.getElementById("stockBtn").classList.add("active");
    }

};

window.setWheels = function(type) {

    wheels.forEach(wheel => {

        if (type === "normal") {
            wheel.rim.material.color.set("#aaaaaa");
            wheel.rim.scale.set(1, 1, 1);
        }

        if (type === "sport") {
            wheel.rim.material.color.set("#111111");
            wheel.rim.scale.set(1.15, 1, 1.15);
        }

        if (type === "race") {
            wheel.rim.material.color.set("#f5f5f5");
            wheel.rim.scale.set(0.85, 1, 0.85);
        }

    });

};

window.setHeight = function(height) {
    car.position.y = height;
};

window.setNeon = function(color) {

    if (color === "off") {
        neon.intensity = 0;
    }

    if (color === "cyan") {
        neon.color.set("#00d9ff");
        neon.intensity = 10;
    }

    if (color === "red") {
        neon.color.set("#ff003c");
        neon.intensity = 10;
    }

    if (color === "purple") {
        neon.color.set("#a020f0");
        neon.intensity = 10;
    }

};

window.resetCar = function() {

    carMaterial.color.set("#0066ff");
    car.position.y = 0;

    spoiler.visible = false;
    streetKit.visible = false;
    raceKit.visible = false;
    neon.intensity = 0;

    document.querySelectorAll(".active").forEach(button => {
        button.classList.remove("active");
    });

    document.getElementById("stockBtn").classList.add("active");
    document.getElementById("wingOff").classList.add("active");

};

window.saveCar = function() {

    const build = {
        color: "#" + carMaterial.color.getHexString(),
        height: car.position.y,
        spoiler: spoiler.visible,
        streetKit: streetKit.visible,
        raceKit: raceKit.visible,
        neon: neon.intensity
    };

    localStorage.setItem("driveforge_build", JSON.stringify(build));

    alert("BUILD SAVED! 🚗🔥");

};


/* LOAD SAVED BUILD */

const savedBuild = localStorage.getItem("driveforge_build");

if (savedBuild) {

    const build = JSON.parse(savedBuild);

    carMaterial.color.set(build.color);
    car.position.y = build.height;
    spoiler.visible = build.spoiler;
    streetKit.visible = build.streetKit;
    raceKit.visible = build.raceKit;
    neon.intensity = build.neon;

}


/* ANIMATION */

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    wheels.forEach(wheel => {
        wheel.group.rotation.z = 0;
    });

    renderer.render(scene, camera);

}

animate();


/* RESIZE */

window.addEventListener("resize", () => {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
