<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Case Opening</title>
<style>
:root{--bg:#0b0f14}
body{margin:0;background:var(--bg);color:white;font-family:Arial;text-align:center}
button{padding:10px 16px;border-radius:10px;border:none;background:#2563eb;color:white;cursor:pointer}
button:disabled{opacity:.5}

.topbar{display:flex;justify-content:center;gap:20px;margin-top:10px}
.balance{background:#111;padding:8px 16px;border-radius:10px}

.stage{margin:30px auto;width:700px;background:#020617;border-radius:16px;padding:20px}
.roller-wrap{position:relative;overflow:hidden}
.marker{position:absolute;left:50%;top:0;bottom:0;width:3px;background:red}
.roller{display:flex}

.slot{width:140px;height:140px;margin:5px;background:#111;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.slot img{width:100px}

.inventory{margin-top:20px}
.item{display:inline-block;margin:6px;padding:6px;border-radius:10px;width:110px;transition:.2s}
.item img{width:90px}

.common{background:#1e3a8a;box-shadow:0 0 10px #60a5fa}
.rare{background:#7f1d1d;box-shadow:0 0 12px #ef4444}
.epic{background:#4c1d95;box-shadow:0 0 14px #a855f7}
.legendary{background:#78350f;box-shadow:0 0 16px gold}
.ultra{background:#831843;box-shadow:0 0 18px hotpink,0 0 30px hotpink}

.item:hover{transform:scale(1.08)}
</style>
</head>
<body>

<h1>CS2 Case Opening</h1>

<div class="topbar">
  <div class="balance">💰 Balance: $<span id="money">100</span></div>
</div>

<button id="openBtn" onclick="openCase()">Åbn Case ($10)</button>

<div class="stage">
  <div class="roller-wrap">
    <div class="marker"></div>
    <div id="roller" class="roller"></div>
  </div>
</div>

<h2>Inventory</h2>
<div id="inv" class="inventory"></div>

<script>
let rolling=false;
let inventory=[];
let money=100;

const skins=[
{name:'Trash',img:'https://picsum.photos/seed/1/100',price:1,rarity:'common'},
{name:'AK',img:'https://picsum.photos/seed/2/100',price:10,rarity:'rare'},
{name:'M4',img:'https://picsum.photos/seed/3/100',price:25,rarity:'epic'},
{name:'AWP',img:'https://picsum.photos/seed/4/100',price:100,rarity:'legendary'},
{name:'Knife',img:'https://picsum.photos/seed/5/100',price:500,rarity:'ultra'}
];

function updateMoney(){
  document.getElementById('money').innerText=money;
}

function openCase(){
  if(rolling) return;
  if(money<10) return alert('Ikke nok penge! Sælg skins');

  money-=10;
  updateMoney();

  rolling=true;
  openBtn.disabled=true;

  const roller=document.getElementById('roller');
  roller.innerHTML='';

  for(let i=0;i<120;i++){
    let s=skins[Math.floor(Math.random()*skins.length)];
    let div=document.createElement('div');
    div.className='slot '+s.rarity;
    div.innerHTML=`<img src='${s.img}'><div>${s.name}</div>`;
    roller.appendChild(div);
  }

  let pos=0;
  let speed=40;

  let int=setInterval(()=>{
    pos-=speed;
    roller.style.transform=`translateX(${pos}px)`;
    speed*=0.97;

    if(speed<0.5){
      clearInterval(int);

      let win=skins[Math.floor(Math.random()*skins.length)];
      inventory.push(win);
      renderInventory();

      rolling=false;
      openBtn.disabled=false;
    }

  },30);
}

function renderInventory(){
  inv.innerHTML='';
  inventory.forEach((s,i)=>{
    let div=document.createElement('div');
    div.className='item '+s.rarity;
    div.innerHTML=`<img src='${s.img}'><br>${s.name}<br>$${s.price}<br>
    <button onclick='sell(${i})'>Sælg</button>`;
    inv.appendChild(div);
  });
}

function sell(i){
  money+=inventory[i].price;
  inventory.splice(i,1);
  updateMoney();
  renderInventory();
}

updateMoney();
</script>

</body>
</html>
